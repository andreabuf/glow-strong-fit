r="Or write your own…" onchange="if(this.value.trim())editPreview(${i},'name',this.value)"></div></div></div>`}).join("")}<button class="primary wide" onclick="newSession()">Start this workout →</button>`;

function editPreview(index,key,value){
let k=data.nextWorkout,items=activeDraft(),groups=[];
items.forEach(x=>{let g=groups.find(g=>g.name===x.name&&g.group===x.group);if(!g){g={name:x.name,group:x.group,items:[]};groups.push(g)}g.items.push(x)});
let g=groups[index];if(!g)return;
if(key==="sets"){let n=Math.max(1,Math.min(12,Number(value)||1)),last=g.items.at(-1),at=items.lastIndexOf(last);if(n>g.items.length)items.splice(at+1,0,...Array.from({length:n-g.items.length},()=>({...last,done:false,note:""})));else if(n<g.items.length){for(let x of g.items.slice(n))items.splice(items.indexOf(x),1)}let count=0;for(let x of items)if(x.name===g.name&&x.group===g.group){x.set=++count;x.total=n}}
else for(let x of g.items){if(key==="minutes")x.secs=Math.max(0,Number(value)||0)*60+(x.secs||0)%60;else if(key==="seconds")x.secs=Math.floor((x.secs||0)/60)*60+Math.max(0,Math.min(59,Number(value)||0));else if(key==="reps"){if(x.kind==="time")x.secs=Math.max(1,Number(value)||1);else x.reps=Math.max(1,Number(value)||1)}else if(key==="weight")x.weight=Math.max(0,Math.round((Number(value)||0)/5)*5);else if(key==="name")applyMovement(x,value.trim()||x.name)}
data.drafts[k]=items;store();previewScreen()
}

ue="${x.weight}" onchange="setWeight(this.value)"></div>`:""}`:""}${isTimed?`<div class="timerarea center"><div class="clock" id="exerciseClock">${formatTime(timer.kind==="exercise"&&timer.remaining>0?timer.remaining:x.secs)}</div><div class="minirow"><button class="secondary" onclick="adjustExercise(-60)">−1m</button><button class="primary" id="exerciseStart" onclick="toggleExerciseTimer()">${timer.kind==="exercise"&&timer.active?"Pause":"Start"}</button><button class="secondary" onclick="adjustExercise(60)">+1m</button></div></div>`:""}<div class="spacer"></div><button class="primary wide" onclick="complete()">Next →</button><div style="margin-top:10px">${x.set?`<button class="link" onclick="addSet()">＋ Add a set</button><span class="muted"> · </span>`:""}<button class="link" onclick="toggleExtra('notes')">＋ ${x.note?"Edit movement note":"Add a note"}</button></div>${expanded==="notes"?`<div class="form"><textarea class="field" placeholder="How did this movement feel?" oninput="setNote(this.value)">${escapeHTML(x.note)}</textarea></div>`:""}${cardEnd()}<div class="actions" style="margin-top:16px"><button class="plain" onclick="previous()">← Back</button><button class="secondary" onclick="skip()">Skip →</button></div><p class="status center" id="status"></p>`;

const movementLibrary={
"Glute bridge pulses":["Banded glute bridge pulses","Glute bridges","Barbell Hip Thrust","Frog pumps"],
"Glute bridges":["Banded glute bridges","Glute bridge pulses","Barbell Hip Thrust"],
"Barbell Back Squat":["Goblet Squat","Front Squat","Box Squat"],
"Barbell Romanian Deadlift":["DB Romanian Deadlift","KB Romanian Deadlift","Single-leg Romanian Deadlift"],
"Bulgarian Split Squat":["Stationary lunges","Reverse lunges","Goblet Squat"],
"Stationary bike":["Hot Girl Walk on treadmill","March in place","Jump rope"],
"Seated fabric-band abductions":["Standing band abductions","Clamshells with band","Side-lying hip abductions"],
"Weighted yoga-ball hamstring curl":["Unweighted yoga-ball hamstring curl","Glute bridge","Hamstring walkouts"],

function movementOptions(x){let all=[x.name,...(x.alternatives||[]),...(movementLibrary[x.name]||[])];let n=x.name.toLowerCase();if(n.includes("bridge"))all.push("Banded glute bridges","Banded glute bridge pulses");if(n.includes("press"))all.push("Push-ups","DB Shoulder Press");if(n.includes("row"))all.push("Single-arm KB Row","Band rows");return [...new Set(all.filter(Boolean))]}
function applyMovement(x,v){x.name=v;x.done=false;let band=/banded|fabric.band|band pull|band abduction|band row|band.assisted/i.test(v);x.kind=band?"band":/plank|march|walk|bike|jump rope/i.test(v)?"time":"reps";if(band){x.band=x.band||"medium";x.weight=null}else if(x.kind==="time"){x.secs=x.secs||60;x.weight=null}else{x.weight=x.weight??0}x.alternatives=movementOptions(x);return x}

function setBand(v){current().band=v;store();render()}
function swapForRemainingSets(v){
 let s=data.session, x=current(), originalName=x.name, originalGroup=x.group;
 // Change only the current and upcoming sets of this exercise, not completed history.
 for(let i=s.idx;i<s.items.length;i++){
  let a=s.items[i];
  if(a.group===originalGroup&&a.name===originalName&&!a.done){
   applyMovement(a,v);
   if(v.includes("Walk"))a.secs=300;
  }
 }
 store();showSwap=false;expanded="";timer.active=false;timer.remaining=0;render();
}
function swapMovement(v){if(v==="__custom"){$("customSwap").classList.remove("hidden");return}swapForRemainingSets(v)}

="historyView()">History</button></div>`}

<details class="card fold"><summary>⌁ Progress graphs</summary><div class="foldbody"><div class="eyebrow">TRENDS</div><h2>Progress over time</h2><select class="field" id="metricSelect" onchange="progressMetric=this.value;drawTrend()">${[["weight","Weight (lb)"],["waist","Waist (in)"],["hips","Hips (in)"],["glutes","Glutes (in)"],["thigh","Thigh (in)"],["arm","Arm (in)"],["chest","Chest (in)"],["abdomen","Lower abdomen (in)"]].map(([v,n])=>`<option value="${v}" ${progressMetric===v?"selected":""}>${n}</option>`).join("")}</select><div id="trend"></div></div></details>
<details class="card fold"><summary>◯ Body measurements</summary><div class="foldbody"><div class="eyebrow">MEASUREMENTS</div><h2>Monthly check-in</h2>${measurementGuide()}<label class="tiny">Date</label><input class="field" type="date" id="measureDate" value="${dayKey(new Date())}"><div class="fields" style="margin-top:12px">${[["waist","Waist"],["hips","Hips"],["glutes","Glutes"],["thigh","Thigh"],["arm","Arm"],["chest","Chest"],["abdomen","Lower abdomen"]].map(([k,n])=>`<div><label class="tiny">${n} (in)</label><input class="field" type="number" min="0" step=".1" id="m_${k}" placeholder="Optional"></div>`).join("")}</div><div class="spacer"></div><label class="toggle"><input type="checkbox" id="flexed"> Flexed measurements (unchecked = relaxed)</label><div class="spacer"></div><button class="primary wide" onclick="addMeasurements()">Save measurements</button><div id="measurementList" style="margin-top:12px"></div></div></details>
<details class="card fold"><summary>▣ Progress photos</summary><div class="foldbody"><div class="eyebrow">PROGRESS PHOTOS</div><h2>My photo timeline</h2><p class="lead">Add photos and compare two dates side by side.</p><label class="tiny">Date</label><input class="field" type="date" id="photoDate" value="${dayKey(new Date())}"><label class="tiny">View</label><select class="field" id="photoView"><option>Front</option><option>Side</option><option>Back</option><option>Other</option></select><input class="field" style="margin-top:10px" id="photoFile" type="file" accept="image/*"><button class="primary wide" style="margin-top:12px" onclick="uploadPhoto()">Add photo</button><p class="tiny">Photos are private to this browser's local storage. They aren't synced or backed up online.</p><div id="photosArea"></div></div></details>
<button class="plain wide" onclick="exportProgress()">Export measurements and weight history</button>`;
drawTrend();renderMeasurements();renderPhotos();
}
function addWeight(){let date=$("weightDate").value,value=Number($("weightValue").value);if(!date||!value||value<=0)return alert("Enter a valid date and weight.");data.weighIns.push({date,value});data.weighIns.sort((a,b)=>a.date.localeCompare(b.date));store();progressScreen()}
function addMeasurements(){let date=$("measureDate").value,entry={date,flexed:$("flexed").checked},any=false;if(!date)return alert("Choose a date.");for(let k of ["waist","hips","glutes","thigh","arm","chest","abdomen"]){let raw=$("m_"+k).value;if(raw!==""){let v=Number(raw);if(!v||v<=0)return alert("Check your measurements.");entry[k]=v;any=true}}if(!any)return alert("Enter at least one measurement.");data.measurements.push(entry);data.measurements.sort((a,b)=>a.date.localeCompare(b.date));store();progressScreen()}
function renderMeasurements(){let el=$("measurementList");el.innerHTML=data.measurements.length?data.measurements.slice().reverse().slice(0,8).map(m=>`<div class="summaryline"><strong>${displayDate(m.date)}</strong><br>${Object.entries(m).filter(([k])=>k!=="date"&&k!=="flexed").map(([k,v])=>`${k}: ${v} in`).join(" · ")} · ${m.flexed?"Flexed":"Relaxed"}</div>`).join(""):'<p class="tiny">No measurements logged yet.</p>'}
function drawTrend(){let points=progressMetric==="weight"?data.weighIns.map(x=>({date:x.date,value:x.value})):data.measurements.filter(x=>x[progressMetric]!=null).map(x=>({date:x.date,value:x[progressMetric]}));points.sort((a,b)=>a.date.localeCompare(b.date));let el=$("trend");if(!points.length){el.innerHTML='<p class="lead">Add your first entry to see your graph.</p>';return}let vals=points.map(p=>p.value),min=Math.min(...vals),max=Math.max(...vals),span=Math.max(1,max-min),w=340,h=180,pad=30;let coords=points.map((p,i)=>[points.length===1?w/2:pad+i*(w-2*pad)/(points.length-1),h-pad-(p.value-min)/span*(h-2*pad)]);el.innerHTML=`<svg viewBox="0 0 340 180" style="width:100%;margin-top:10px" role="img" aria-label="Progress graph"><path d="M30 15V150H310" fill="none" stroke="#e4d8de" stroke-width="1.5"/><path d="${coords.map(([x,y],i)=>`${i?"L":"M"}${x},${y}`).join(" ")}" fill="none" stroke="#9e6782" stroke-width="3"/>${coords.map(([x,y])=>`<circle cx="${x}" cy="${y}" r="4" fill="#9e6782"/>`).join("")}<text x="31" y="12" font-size="11" fill="#8c7b85">${max.toFixed(1)}</text><text x="31" y="167" font-size="11" fill="#8c7b85">${min.toFixed(1)}</text></svg><div class="row tiny"><span>${displayDate(points[0].date)}</span><span>${displayDate(points.at(-1).date)}</span></div><p class="tiny">${points.length} entries · Latest: ${points.at(-1).value}</p>`}
function exportProgress(){let blob=new Blob([JSON.stringify({weighIns:data.weighIns,measurements:data.measurements},null,2)],{type:"application/json"}),url=URL.createObjectURL(blob),a=document.createElement("a");a.href=url;a.download="glow-strong-progress.json";a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)}
function photoDB(){return new Promise((resolve,reject)=>{let r=indexedDB.open("gsf_photo_storage",1);r.onupgradeneeded=()=>r.result.createObjectStore("photos",{keyPath:"id"});r.onsuccess=()=>resolve(r.result);r.onerror=()=>reject(r.error)})}
async function uploadPhoto(){let file=$("photoFile").files[0],date=$("photoDate").value,view=$("photoView").value;if(!file||!date)return alert("Choose a photo and date.");if(!file.type.startsWith("image/"))return alert("Choose an image.");try{let db=await photoDB(),id=Date.now()+"_"+Math.random().toString(36).slice(2);await new Promise((resolve,reject)=>{let tx=db.transaction("photos","readwrite");tx.objectStore("photos").put({id,date,view,blob:file});tx.oncomplete=resolve;tx.onerror=()=>reject(tx.error)});data.photoMeta.push({date,id,view});store();renderPhotos()}catch(e){alert("Could not save photo: "+e.message)}}
async function getPhotos(){let db=await photoDB();return new Promise((resolve,reject)=>{let r=db.transaction("photos","readonly").objectStore("photos").getAll();r.onsuccess=()=>resolve(r.result.sort((a,b)=>a.date.localeCompare(b.date)));r.onerror=()=>reject(r.error)})}
async function renderPhotos(){let el=$("photosArea");if(!el)return;photoURLs.forEach(u=>URL.revokeObjectURL(u));photoURLs=[];try{let photos=await getPhotos();if(!document.contains(el))return;if(!photos.length){el.innerHTML='<p class="lead">No photos yet.</p>';return}let opts=photos.map(p=>`<option value="${escapeHTML(p.id)}">${displayDate(p.date)} · ${escapeHTML(p.view)}</option>`).join("");el.innerHTML=`<p class="tiny">${photos.length} photos saved. Choose two to compare.</p><div class="divider"></div><div class="eyebrow">SIDE-BY-SIDE COMPARISON</div><div class="fields"><div><label class="tiny">Before</label><select class="field" id="photoA" onchange="comparePhotos()">${opts}</select></div><div><label class="tiny">After</label><select class="field" id="photoB" onchange="comparePhotos()">${opts}</select></div></div><div id="compareArea" class="photogrid"></div>`;$("photoA").value=photos.some(p=>p.id===photoA)?photoA:photos[0].id;$("photoB").value=photos.some(p=>p.id===photoB)?photoB:photos.at(-1).id;comparePhotos(photos)}catch(e){el.innerHTML='<p class="tiny">Photo storage unavailable in this browser preview.</p>'}}
async function comparePhotos(provided){let photos=provided||await getPhotos(),a=$("photoA")?.value,b=$("photoB")?.value,el=$("compareArea");if(!el)return;photoA=a;photoB=b;el.innerHTML=[a,b].map((id,i)=>{let p=photos.find(p=>p.id===id);if(!p)return "";let u=URL.createObjectURL(p.blob);photoURLs.push(u);return `<div><div class="tiny">${i?"AFTER":"BEFORE"} · ${displayDate(p.date)}</div><img src="${u}" alt="Comparison photo"></div>`}).join("")}

function formatElapsed(ms){let secs=Math.floor(Math.max(0,ms)/1000);return `${Math.floor(secs/3600)>0?`${Math.floor(secs/3600)}:`:""}${String(Math.floor(secs/60)%60).padStart(2,"0")}:${String(secs%60).padStart(2,"0")}`}

function sectionBars(x){
 let arr=data.session.items,idx=data.session.idx,start=idx,end=idx;
 const same=(a,b)=>a.group===b.group&&(x.group==="Warm-up"||x.group==="Core Circuit"||x.group==="Accessory Superset"||a.name===b.name);
 while(start>0&&same(arr[start-1],x))start--;
 while(end<arr.length-1&&same(arr[end+1],x))end++;
 return `<div class="sectionprogress">${arr.slice(start,end+1).map((a,i)=>`<span class="${a.done?"done":start+i===idx?"now":"future"}"></span>`).join("")}</div>`;
}
function addSet(){let s=data.session,x=current(),end=s.idx;while(end+1<s.items.length&&s.items[end+1].name===x.name&&s.items[end+1].group===x.group)end++;let group=s.items.filter(a=>a.name===x.name&&a.group===x.group);s.items.splice(end+1,0,{...x,done:false,note:"",set:group.length+1,total:group.length+1});s.items.filter(a=>a.name===x.name&&a.group===x.group).forEach((a,i,all)=>{if(a.set){a.set=i+1;a.total=all.length}});store();render()}
function setBoxes(x){
 let s=data.session, arr=s.items, ix=s.idx;
 let ids=arr.map((a,i)=>({a,i})).filter(({a})=>a.name===x.name&&a.group===x.group);
 if(ids.length<2)return '';
 return `<div class="setboxes">${ids.map(({a,i},n)=>`<span class="setbox ${a.done?'finished':i===ix?'current':'pending'}" title="Set ${n+1}">${a.done?'✓':n+1}</span>`).join('')}</div>`;
}
function displayDate(date){if(!date)return "";let a=String(date).split("-");return a.length===3?`${Number(a[1])}/${Number(a[2])}/${a[0]}`:date}
function dayKey(d){return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`}
function workoutDates(){
 return new Set(data.history.map(h=>h.day||(()=>{let d=new Date(h.id||h.date);return isNaN(d)?null:dayKey(d)})()).filter(Boolean));
}
function streak(){
 const days=workoutDates();const weights=new Set(data.weighIns.map(x=>x.date));const photos=new Set(data.photoMeta.map(x=>x.date));let d=new Date();d.setHours(12,0,0,0);
 if(!days.has(dayKey(d)))d.setDate(d.getDate()-1);
 let n=0;while(days.has(dayKey(d))){n++;d.setDate(d.getDate()-1)}return n;
}

let selectedDay=dayKey(new Date()),returnCalendarPage="home";
function editCalendarDay(key){selectedDay=key;returnCalendarPage=page;page="calendarDay";render()}
function calendarDayScreen(){
let notes=data.dayNotes[selectedDay]||[],hasWorkout=data.history.some(h=>(h.day||dayKey(new Date(h.id||h.date)))===selectedDay),hasWeight=data.weighIns.some(w=>w.date===selectedDay),hasPhoto=data.photoMeta.some(p=>p.date===selectedDay);
$("app").innerHTML=`<div class="card"><div class="eyebrow">MY CALENDAR</div><h1>${displayDate(selectedDay)}</h1><p class="lead">Every day has a story. Rest and recovery are part of progress.</p>
${hasWorkout?'<div class="note">♥ Workout logged</div>':''}${hasWeight?'<div class="note">⚖ Weight recorded</div>':''}${hasPhoto?'<div class="note">▣ Progress photo added</div>':''}
<div class="divider"></div><div class="eyebrow">MARK THIS DAY</div>
${[["rest","☾","Rest day"],["sick","✚","Sick / recovering"],["period","●","On my period"],["travel","✈","Out of town"]].map(([key,icon,label])=>`<label class="dayoption"><input type="checkbox" ${notes.includes(key)?"checked":""} onchange="setDayStatus('${key}',this.checked)"><span>${icon} ${label}</span></label>`).join("")}
<p class="tiny">You can select more than one, such as workout + period, or travel + rest.</p>
<label class="tiny">Optional notes</label><textarea class="field" id="dayComment" placeholder="How was your day?" oninput="setDayComment(this.value)">${escapeHTML(data.dayComments?.[selectedDay]||"")}</textarea>
<div class="spacer"></div><button class="primary wide" onclick="page=returnCalendarPage;render()">Done</button></div>`;
}
function setDayStatus(k,checked){let notes=new Set(data.dayNotes[selectedDay]||[]);if(checked)notes.add(k);else notes.delete(k);data.dayNotes[selectedDay]=[...notes];store()}
function setDayComment(v){data.dayComments??={};data.dayComments[selectedDay]=v;store()}

function calendarHTML(){
 const today=new Date(),year=today.getFullYear(),month=today.getMonth(),first=(new Date(year,month,1).getDay()+6)%7,count=new Date(year,month+1,0).getDate(),days=workoutDates(),weights=new Set(data.weighIns.map(x=>x.date)),photos=new Set(data.photoMeta.map(x=>x.date));
 let cells=Array.from({length:first},()=>'<span class="calblank"></span>');
 for(let n=1;n<=count;n++){let d=new Date(year,month,n),key=dayKey(d),done=days.has(key);cells.push(`<button onclick="editCalendarDay('${key}')" aria-label="Edit ${key}" class="calday ${done?'trained':''} ${key===dayKey(today)?'today':''}"><span>${n}</span><span class="calicons">${done?'♥':''}${weights.has(key)?'⚖':''}${photos.has(key)?'▣':''}${(data.dayNotes[key]||[]).includes("rest")?'☾':''}${(data.dayNotes[key]||[]).includes("sick")?'✚':''}${(data.dayNotes[key]||[]).includes("period")?'●':''}${(data.dayNotes[key]||[]).includes("travel")?'✈':''}</span></button>`)}
 return `<div class="card calendar"><div class="row"><div><div class="eyebrow">YOUR CONSISTENCY</div><h2>${today.toLocaleString('en-US',{month:'long',year:'numeric'})}</h2></div><div class="streak"><strong>${streak()}</strong><span>day streak</span></div></div><div class="calgrid">${['M','T','W','T','F','S','S'].map(x=>`<span class="calheading">${x}</span>`).join('')}${cells.join('')}</div><p class="tiny">Tap a date to edit · ♥ workout · ⚖ weight · ▣ photo · ☾ rest · ✚ sick · ● period · ✈ travel.</p></div>`;
}

setInterval(()=>{if(data.session&&page==="session"&&!data.session.finished){let t=$("worktime");if(t)t.textContent=formatElapsed(Date.now()-data.session.started)}if(!data.session||data.session.finished)return;if(data.hydration&&Date.now()-data.session.lastWater>=15*60000)data.session.waterDue=true;if(timer.active){timer.remaining=Math.max(0,Math.ceil((timer.end-Date.now())/1000));if(timer.remaining===0){timer.active=false;try{navigator.vibrate?.(150)}catch{}}let el=$(timer.kind==="rest"?"restClock":"exerciseClock");if(el)el.textContent=formatTime(timer.remaining);let btn=$(timer.kind==="rest"?"restStart":"exerciseStart");if(btn)btn.textContent=timer.active?"Pause":"Start"}},250);
render();
</script></body></html>
